name: ${PROJECT_NAME}

services:
  registry-server:
    build:
      context: ../../fyp-grading-registry-server
    image: ${REGISTRY_SERVER_NAME}:1.0
    container_name: ${REGISTRY_SERVER_NAME}
    environment:
      - SPRING_APPLICATION_NAME=${REGISTRY_SERVER_NAME}
      - EUREKA_HOSTNAME=registry-server
      - BUILD_VERSION=1.0
      - PORT=8761
    expose:
      - 8761
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8761/actuator/health/readiness | grep UP || exit 1" ]
    deploy:
      resources:
        limits:
          memory: 320m
    extends:
      file: common.yml
      service: spring-service

  config-server:
    build:
      context: ../../fyp-grading-config-server
    image: ${CONFIG_SERVER_NAME}:1.0
    container_name: ${CONFIG_SERVER_NAME}
    environment:
      - GIT_REPO_URI=${GIT_REPO_URI}
      - GIT_BRANCH=${GIT_BRANCH}
      - SPRING_APPLICATION_NAME=${CONFIG_SERVER_NAME}
      # native: serve the local fyp-grading-config checkout (mounted below); use "git" to read GIT_REPO_URI instead.
      - SPRING_PROFILES_ACTIVE=${CONFIG_SERVER_PROFILE:-native}
      - CONFIG_DIR=/config
      - BUILD_VERSION=1.0
      - PORT=8071
    volumes:
      - ../../fyp-grading-config:/config:ro
    expose:
      - 8071
    depends_on:
      rabbitmq:
        condition: service_healthy
      registry-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8071/actuator/health/readiness | grep UP || exit 1" ]
    deploy:
      resources:
        limits:
          memory: 256m
    extends:
      file: common.yml
      service: spring-service

  api-gateway:
    build:
      context: ../../fyp-grading-api-gateway
    image: ${API_GATEWAY_NAME}:1.0
    container_name: ${API_GATEWAY_NAME}
    environment:
      - AUTH_SERVER_URL=http://keycloak-server:8080/realms/assay
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:[*]}
      - SPRING_APPLICATION_NAME=${API_GATEWAY_NAME}
      - BUILD_VERSION=1.0
      - PORT=9191
    ports:
      - '127.0.0.1:9191:9191'
    expose:
      - 9191
    depends_on:
      keycloak-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      evaluation-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      rubric-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:9192/actuator/health/readiness | grep UP || exit 1" ]
    deploy:
      resources:
        limits:
          memory: 384m
    extends:
      file: common.yml
      service: spring-service

networks:
  fyp-grading:
    name: ${GLOBAL_NETWORK_NAME}
