name: ${PROJECT_NAME}

services:
  frontend:
    build:
      context: ../../fyp-grading-frontend
    image: ${FRONTEND_SERVICE_NAME}:1.0
    container_name: ${FRONTEND_SERVICE_NAME}
    ports:
      - '127.0.0.1:80:8080'   # the image runs nginx unprivileged, on 8080
    expose:
      - 8080
    extends:
      file: common.yml
      service: network-service

networks:
  fyp-grading:
    name: ${GLOBAL_NETWORK_NAME}
