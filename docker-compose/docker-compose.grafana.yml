name: ${PROJECT_NAME}

services:
  read:
    image: grafana/loki:3.1.0
    container_name: loki-read
    command: "-config.file=/etc/loki/config.yaml -target=read"
    ports:
      - '127.0.0.1:3101:3100'
      - '127.0.0.1::7946'
      - '127.0.0.1::9095'
    volumes:
      - ./config/grafana/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: &loki-dns
      fyp-grading:
        aliases:
          - loki

  write:
    image: grafana/loki:3.1.0
    container_name: loki-write
    command: "-config.file=/etc/loki/config.yaml -target=write"
    ports:
      - '127.0.0.1:3102:3100'
      - '127.0.0.1::7946'
      - '127.0.0.1::9095'
    volumes:
      - ./config/grafana/loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - minio
    networks:
      <<: *loki-dns

  alloy:
    image: grafana/alloy:v1.22.0
    container_name: alloy
    volumes:
      - ./config/grafana/alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - '127.0.0.1:12345:12345'
    depends_on:
      - gateway
    extends:
      file: common.yml
      service: network-service

  minio:
    # MinIO stopped publishing minio/minio (Docker Hub and quay.io). Chainguard's free build is published as latest
    # only, so it is pinned by digest; -dev has the shell the entrypoint below needs.
    image: chainguard/minio:latest-dev@sha256:9847741f83af2386200f45cf77f87850f4d56a10d178167ae963bde9fee77be2
    container_name: minio
    user: '0:0'   # writes to the ./.data/minio bind mount, which belongs to the host user (dev only)
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - '127.0.0.1::9000'
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    extends:
      file: common.yml
      service: network-service

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # Grafana 12+ downloads its "preinstalled" plugins at start and doesn't listen until that ends; Loki needs none.
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - ./config/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on:
      - gateway
    entrypoint:
      - sh
      - -euc
      - /run.sh
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extends:
      file: common.yml
      service: network-service

  backend:
    image: grafana/loki:3.1.0
    container_name: loki-backend
    volumes:
      - ./config/grafana/loki-config.yaml:/etc/loki/config.yaml
    ports:
      - '127.0.0.1::3100'
      - '127.0.0.1::7946'
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"
    depends_on:
      - gateway
    extends:
      file: common.yml
      service: network-service

  gateway:
    image: nginx:1.31.9
    container_name: grafana-nginx
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        user  nginx;
        worker_processes  5;  ## Default: 1

        events {
          worker_connections   1000;
        }

        http {
          resolver 127.0.0.11;

          server {
            listen             3100;

            location = / {
              return 200 'OK';
              auth_basic off;
            }

            location = /api/prom/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /api/prom/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /api/prom/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }

            location = /loki/api/v1/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /loki/api/v1/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /loki/api/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - '127.0.0.1:3100:3100'
    healthcheck:
      test: [ "CMD", "service", "nginx", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extends:
      file: common.yml
      service: network-service

networks:
  fyp-grading:
    name: ${GLOBAL_NETWORK_NAME}
