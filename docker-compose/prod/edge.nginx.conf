# The production edge: the one way into the stack (see compose.yml). Mounted over the frontend image's own nginx.conf.
#
#   /api/**                     -> api-gateway:9191 (the gateway routes only /api/** onwards)
#   /realms/assay/**, /resources/** -> keycloak-server:8080 (sign-in pages, tokens, keys, theme assets)
#   everything else             -> the app (index.html for client-side routes)
#
# Never routed: Keycloak's /admin and every other realm (/realms/master), the management and actuator ports, and
# backend paths that would otherwise fall through to index.html.
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log off;   # Cloudflare has the request log; keep the container log for errors
    error_log /dev/stderr warn;

    # Unprivileged and read-only: every writable path is in /tmp (a tmpfs in compose.yml).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Docker's DNS, re-resolved: a restarted container comes back on a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Behind Cloudflare the tunnel says https; a local check over 127.0.0.1 is plain http.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }
    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        ''      $http_host;
    }

    gzip_static on;   # the image ships .gz copies of the text assets
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 1m;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        set $gateway  http://api-gateway:9191;
        set $keycloak http://keycloak-server:8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # CF-Connecting-IP passes through untouched: Cloudflare sets it, and the gateway believes it only from here.

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The notification stream (SSE): no buffering, long reads.
        location = /api/notifications/stream {
            proxy_pass $gateway;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location ^~ /api/ {
            proxy_pass $gateway;
        }

        location ^~ /realms/assay/ {
            proxy_pass $keycloak;
            proxy_buffer_size 16k;   # Keycloak's sign-in responses carry large cookies
            proxy_buffers 8 16k;
        }

        location ^~ /resources/ {
            proxy_pass $keycloak;
        }

        # Backend and Keycloak paths that aren't routed: a plain 404, not the app's index.html. (The prefix locations
        # above use ^~, so this regex never shadows them.)
        location ~ ^/(realms|admin|actuator|internal|config|eureka|swagger-ui|v3|[a-z]+-service)(/|$) {
            return 404;
        }

        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
            try_files $uri $uri/ /index.html;
        }
    }
}
