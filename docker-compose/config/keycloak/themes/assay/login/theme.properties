# Assay login theme: Keycloak's plain `base` templates, with our own layout (template.ftl), the login, error, info,
# page-expired and sign-out pages, English copy and one stylesheet. Every other page Keycloak can show still uses the base
# template, dressed through the class names below. No PatternFly, no external requests: fonts are self-hosted.
parent=base
import=common/keycloak
styles=css/assay.css
locales=en
meta=viewport==width=device-width,initial-scale=1 robots==noindex,nofollow color-scheme==light dark

kcHtmlClass=as-html
kcBodyClass=as-body
kcLoginClass=as-page

kcContentWrapperClass=as-row
kcLabelWrapperClass=as-label-wrap
kcInputWrapperClass=as-input-wrap
kcFormGroupClass=as-field
kcFormSettingClass=as-form-options
kcFormOptionsWrapperClass=as-form-options-wrap
kcSignUpClass=as-info
kcInfoAreaWrapperClass=as-info-wrap

kcLabelClass=as-label
kcInputClass=as-input
kcInputErrorMessageClass=as-field-error
kcInputHelperTextBeforeClass=as-help
kcInputHelperTextAfterClass=as-help
kcInputGroup=as-input-group
kcCheckboxInputClass=as-checkbox

kcFormPasswordVisibilityButtonClass=as-reveal
kcFormPasswordVisibilityIconShow=as-ic as-ic-eye
kcFormPasswordVisibilityIconHide=as-ic as-ic-eye-off
kcResetFlowIcon=as-ic as-ic-back

kcButtonClass=as-btn
kcButtonPrimaryClass=as-btn-primary
kcButtonSecondaryClass=as-btn-secondary
kcButtonDefaultClass=as-btn-secondary
kcButtonBlockClass=as-btn-block
kcButtonLargeClass=

kcAlertClass=as-alert
kcAlertTitleClass=as-alert-text
kcFeedbackErrorIcon=as-ic as-ic-error
kcFeedbackWarningIcon=as-ic as-ic-warn
kcFeedbackSuccessIcon=as-ic as-ic-ok
kcFeedbackInfoIcon=as-ic as-ic-info
