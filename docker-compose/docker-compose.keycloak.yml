name: ${PROJECT_NAME}

services:
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    ports:
      - '127.0.0.1:5435:5432'
    environment:
      POSTGRES_DB: keycloak-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d keycloak-db -U admin" ]
    extends:
      file: common.yml
      service: database-service

  keycloak-server:
    build: ./config/keycloak
    image: keycloak-server
    container_name: keycloak-server
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak-db
      - KC_DB_USERNAME=admin
      - KC_DB_PASSWORD=admin
      # One public issuer for every token, whichever network path fetched it.
      - KC_HOSTNAME=${KEYCLOAK_PUBLIC_URL:-http://localhost:7080}
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_MANAGEMENT_PORT=9000
      - KC_HTTP_PORT=8080
      - KC_HTTP_ENABLED=true
    ports:
      - '127.0.0.1:7080:8080'
      - '127.0.0.1:9000:9000'
    expose:
      - 9080
      - 9000
    depends_on:
      keycloak-db:
        condition: service_healthy
    extends:
      file: common.yml
      service: network-service

volumes:
  keycloak-db-data:
    name: keycloak-db-data

networks:
  fyp-grading:
    name: ${GLOBAL_NETWORK_NAME}
