name: ${PROJECT_NAME}

# TODO: ADD VOLUMES
services:
  redis:
    image: redis:8.4.8-alpine@sha256:ff72f74e4f471df79ed920aa8bbc35efe72ff8a1f8acdc50aad5dbb9b14a4034   # as in production
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    expose:
      - 6379
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    extends:
      file: common.yml
      service: network-service

networks:
  fyp-grading:
    name: ${GLOBAL_NETWORK_NAME}
