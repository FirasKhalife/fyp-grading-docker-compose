version: 2
# Weekly updates for the pinned versions: the Keycloak image's base, the third-party images of the production compose
# (pinned by version and digest) and the GitHub Actions (pinned by commit SHA).
updates:
  - package-ecosystem: docker
    directory: /docker-compose/config/keycloak
    schedule: {interval: weekly, day: monday}
  # The derived Postgres and MongoDB images: patch and minor releases only. A new major version can't open the
  # existing data volumes (Postgres needs a dump and restore, MongoDB a feature-compatibility upgrade), so do it by hand.
  - package-ecosystem: docker
    directory: /docker-compose/config/postgres
    schedule: {interval: weekly, day: monday}
    ignore: [{dependency-name: postgres, update-types: [version-update:semver-major]}]
  - package-ecosystem: docker
    directory: /docker-compose/config/mongo
    schedule: {interval: weekly, day: monday}
    ignore: [{dependency-name: mongo, update-types: [version-update:semver-major]}]
  - package-ecosystem: docker-compose
    directory: /docker-compose/prod
    schedule: {interval: weekly, day: monday}
    groups:
      images: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions: {patterns: ["*"]}
