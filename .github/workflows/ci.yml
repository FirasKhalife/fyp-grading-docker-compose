name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays: the cross-repo consistency check
    - cron: '0 3 * * *'   # nightly: the production stack end to end, from the latest published images

permissions:
  contents: read

jobs:
  validate:
    name: Lint scripts, compose files, realm and seed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck the scripts
        run: shellcheck --severity=warning docker-compose.sh run-demo.sh e2e/*.sh scripts/*.sh

      # The service repos aren't checked out here, so build paths are not resolved.
      - name: Compose files are valid
        working-directory: docker-compose
        run: |
          args=(); for f in docker-compose.*.yml; do args+=(-f "$f"); done
          docker compose "${args[@]}" config --no-path-resolution --quiet

      # Every required secret filled with a placeholder; checks the production file and that each service has a
      # memory limit, a health check, rotated logs, a read-only root, no capabilities and no privilege escalation;
      # that third-party images are pinned by digest; and that only the edge publishes a port (on 127.0.0.1).
      - name: Production compose is valid and complete
        working-directory: docker-compose/prod
        run: |
          sed 's/=$/=ci-placeholder/' .env.example > "$RUNNER_TEMP/prod.env"
          docker compose --env-file "$RUNNER_TEMP/prod.env" --profile tunnel config --format json > "$RUNNER_TEMP/prod.json"
          python3 - "$RUNNER_TEMP/prod.json" <<'PY'
          import json, re, sys
          services = json.load(open(sys.argv[1]))["services"]
          problems = []
          for name, s in services.items():
              if not s.get("deploy", {}).get("resources", {}).get("limits", {}).get("memory"):
                  problems.append(f"{name}: no memory limit")
              if not s.get("healthcheck", {}).get("test"):
                  problems.append(f"{name}: no health check")
              if s.get("logging", {}).get("options", {}).get("max-size") is None:
                  problems.append(f"{name}: no log rotation")
              if s.get("restart") != "unless-stopped":
                  problems.append(f"{name}: restart is {s.get('restart')}")
              if "build" in s:
                  problems.append(f"{name}: builds locally instead of pulling a published image")
              image = s.get("image", "")
              if not image.startswith("ghcr.io/firaskhalife/") and ("@sha256:" not in image or ":latest" in image):
                  problems.append(f"{name}: third-party image {image} isn't pinned to a version and digest")
              # The derived third-party images built here carry their base's version as the tag.
              for derived in ("postgres", "mongo"):
                  if image.startswith(f"ghcr.io/firaskhalife/fyp-grading-{derived}:"):
                      base = re.search(r"^FROM [^:\s]+:([^@\s]+)", open(f"../config/{derived}/Dockerfile").read(), re.M)
                      if image.split(":")[1].split("@")[0] != base.group(1):
                          problems.append(f"{name}: {image} doesn't match config/{derived}/Dockerfile ({base.group(1)})")
              if not s.get("read_only"):
                  problems.append(f"{name}: root filesystem isn't read-only")
              if s.get("cap_drop") != ["ALL"]:
                  problems.append(f"{name}: capabilities aren't all dropped")
              if "no-new-privileges:true" not in s.get("security_opt", []):
                  problems.append(f"{name}: no-new-privileges isn't set")
              for p in s.get("ports", []):
                  if name != "edge" or p.get("host_ip") != "127.0.0.1":
                      problems.append(f"{name}: publishes {p}")
          total = sum(int(s["deploy"]["resources"]["limits"]["memory"]) for s in services.values()) / 2**20
          print(f"{len(services)} services, memory limits add up to {total:.0f} MiB")
          if total > 6 * 1024:
              problems.append(f"limits add up to {total:.0f} MiB, over the 6 GiB budget of the 8 GB host")
          assert not problems, "\n".join(problems)
          PY

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: The API checks compile
        run: python -m py_compile e2e/api-checks.py

      - name: Keycloak realm export is valid JSON with the five personas
        run: |
          python - <<'PY'
          import json
          realm = json.load(open("docker-compose/config/keycloak/import/assay-realm.json"))
          users = {u["username"] for u in realm["users"]}
          missing = {"rania.haddad", "jane.smith", "karim.nassar", "nour.khoury", "ahmad.fares"} - users
          assert realm["realm"] == "assay", realm["realm"]
          assert not missing, f"missing personas: {missing}"
          assert all(c["publicClient"] for c in realm["clients"]), "the SPA client must be public (no secret)"
          import os
          assert realm.get("loginTheme") == "assay", "the realm must use the Assay login theme"
          assert os.path.isfile("docker-compose/config/keycloak/themes/assay/login/theme.properties"), "the Assay theme is missing"
          print(f"realm {realm['realm']}: {len(users)} users, {len(realm['clients'])} client(s)")
          PY

      # The generator asserts the seed reproduces the design's grades through the real grade maths.
      - name: Seed generator runs and its checks pass
        run: ASSAY_WORKSPACE="$RUNNER_TEMP/ws" python seed/generate.py > "$RUNNER_TEMP/seed.log" && tail -5 "$RUNNER_TEMP/seed.log"

  cross-repo:
    name: Service repos agree (shared code, fixtures, seeds)
    # Needs the service repos' default branches; run it by hand or weekly so it never blocks a pull request here.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fyp-grading-docker-compose
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: FirasKhalife/fyp-grading-admin-service, path: fyp-grading-admin-service}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: FirasKhalife/fyp-grading-evaluation-service, path: fyp-grading-evaluation-service}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: FirasKhalife/fyp-grading-rubric-service, path: fyp-grading-rubric-service}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: FirasKhalife/fyp-grading-notification-service, path: fyp-grading-notification-service}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: FirasKhalife/fyp-grading-api-gateway, path: fyp-grading-api-gateway}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: FirasKhalife/fyp-grading-config-server, path: fyp-grading-config-server}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: FirasKhalife/fyp-grading-registry-server, path: fyp-grading-registry-server}

      - name: Shared code, build files and payload fixtures are identical
        run: bash fyp-grading-docker-compose/scripts/check-shared-code.sh "$GITHUB_WORKSPACE"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: The services' committed seeds are what the generator produces
        run: |
          python fyp-grading-docker-compose/seed/generate.py > /dev/null
          for r in admin-service evaluation-service rubric-service notification-service; do
            git -C "fyp-grading-$r" diff --exit-code -- src/main/resources/demo/seed.json
          done

  # The images built here, each from docker-compose/config/<name>:
  # - keycloak: the Assay realm, login theme, account console off. Tags: latest and the short commit SHA.
  # - postgres, mongo: the official images minus gosu and unused tools (see their Dockerfiles). Tags: the upstream
  #   version (the tag the production compose uses) and the short commit SHA.
  # Built on every run and scanned with Trivy. The full report goes to GitHub code scanning; the job fails on any HIGH
  # or CRITICAL finding that has a fix (accepted unfixable ones are listed in .trivyignore). Only the default branch
  # pushes them, to ghcr.io/firaskhalife/fyp-grading-<name>, with an SBOM and build provenance attached, and signs them
  # with cosign (keyless, GitHub OIDC). amd64 only: the demo host is amd64, and an arm64 build would run under emulation.
  images:
    name: ${{ matrix.title }} image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: keycloak, title: Keycloak, sarif: image}
          - {name: postgres, title: Postgres, sarif: image-postgres}
          - {name: mongo, title: MongoDB, sarif: image-mongo}
    permissions:
      contents: read
      packages: write         # push to GHCR
      security-events: write  # upload the scan to code scanning
      id-token: write         # cosign keyless signing
    env:
      IMAGE: ghcr.io/firaskhalife/fyp-grading-${{ matrix.name }}
      CONTEXT: docker-compose/config/${{ matrix.name }}
      PUSH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keycloak is published as latest; a derived image as its base's version (postgres:16.16-alpine3.24 becomes
      # fyp-grading-postgres:16.16-alpine3.24).
      - id: version
        run: |
          if [ "${{ matrix.name }}" = keycloak ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(sed -n 's/^FROM [^:[:space:]]*:\([^@[:space:]]*\).*/\1/p' "$CONTEXT/Dockerfile" | head -n 1)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ env.PUSH }}
            type=sha,prefix=,format=short

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Scan (every finding, for code scanning)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$PWD:/src" -w /src \
            "$TRIVY" image --scanners vuln --ignorefile .trivyignore --format sarif --output trivy.sarif "$IMAGE:scan"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.sarif }}

      - name: No fixable HIGH or CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$PWD:/src" -w /src \
            "$TRIVY" image --scanners vuln --ignorefile .trivyignore --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 "$IMAGE:scan"

      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build from the cache, pushed with an SBOM and max-mode provenance.
      - id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}

      - if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign (cosign keyless)
        if: env.PUSH == 'true'
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

  # The production compose started the way a visitor would (./run-demo.sh), then the smoke test, the API rule checks,
  # the security checks, the persona reset script and the frontend's Playwright real-stack suite against its edge on
  # http://localhost:8080. The services, the gateway and the frontend come from GHCR (latest); the three images this
  # repo builds are built from this checkout first, so a pull request tests its own realm, theme and database images.
  # On pull requests and nightly (new service images land every day).
  integration:
    name: Production stack end to end
    needs: validate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest   # 4 vCPUs and 16 GB for public repositories; the stack's limits add up to 5.4 GiB
    timeout-minutes: 60
    env:
      PROD: docker-compose/prod
      EDGE: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build this repository's images (Keycloak, Postgres, MongoDB)
        run: |
          sed 's/=$/=ci-placeholder/' "$PROD/.env.example" > "$RUNNER_TEMP/prod.env"
          docker compose --project-directory "$PROD" -f "$PROD/compose.yml" --env-file "$RUNNER_TEMP/prod.env" \
            config --images | sort -u > "$RUNNER_TEMP/images"
          for name in keycloak postgres mongo; do
            ref="$(grep -m 1 "^ghcr.io/firaskhalife/fyp-grading-$name:" "$RUNNER_TEMP/images")"
            echo "building $ref"
            docker build -q -t "$ref" "docker-compose/config/$name"
          done

      # GHCR answers "denied" to an anonymous pull of a package that is still private: say which ones and what to do.
      - name: The published images can be pulled
        run: |
          denied=(); failed=()
          while read -r ref; do
            docker image inspect "$ref" >/dev/null 2>&1 && continue
            if ! out="$(docker pull -q "$ref" 2>&1)"; then
              if grep -qiE 'denied|unauthorized|not found|manifest unknown' <<<"$out"; then denied+=("$ref"); else failed+=("$ref: $out"); fi
            fi
          done < "$RUNNER_TEMP/images"
          for ref in "${denied[@]}"; do
            package="${ref#ghcr.io/firaskhalife/}"; package="${package%%[:@]*}"
            echo "::error title=Image not public::$ref can't be pulled anonymously. If it is published, make the package public: github.com/FirasKhalife?tab=packages > $package > Package settings > Change visibility > Public."
          done
          for f in "${failed[@]}"; do echo "::error title=Pull failed::$f"; done
          [ ${#denied[@]} -eq 0 ] && [ ${#failed[@]} -eq 0 ]

      - name: Start the stack (./run-demo.sh)
        run: ./run-demo.sh

      - name: Smoke test
        run: APP_ORIGIN="$EDGE" e2e/smoke.sh "$EDGE" "$EDGE"

      - name: API rule checks
        run: python3 e2e/api-checks.py "$EDGE" "$EDGE"

      - name: Security checks
        run: APP_ORIGIN="$EDGE" COMPOSE_PROJECT_NAME=assay e2e/security.sh "$EDGE" "$EDGE"

      # The host's nightly cron runs it; here it must work on the read-only container with its defaults.
      - name: The persona reset script works on the production Keycloak
        run: scripts/keycloak-reset-personas.sh

      # The frontend's own end-to-end suite in a real browser against this stack's edge (fyp-grading-frontend master,
      # playwright.real.config.ts). Every test makes its own demo copy, so the gateway's copy limit is lifted first:
      # the checks above ran with the production limit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: FirasKhalife/fyp-grading-frontend, ref: master, path: frontend}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium

      - name: Lift the demo-copy limit for Playwright
        run: |
          echo 'GATEWAY_COPY_RATE=600' >> "$PROD/.env"
          docker compose --project-directory "$PROD" -f "$PROD/compose.yml" up -d --wait --wait-timeout 300 api-gateway

      - name: Playwright real-stack suite
        working-directory: frontend
        env:
          ASSAY_BASE_URL: ${{ env.EDGE }}
          PW_CHANNEL: chromium   # Playwright's own Chromium, installed above
        run: npx playwright test -c playwright.real.config.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && hashFiles('frontend/playwright-report/**') != ''
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Memory after the checks
        if: always()
        run: |
          {
            echo '### Memory after the checks'
            echo
            echo '| Container | Usage / limit |'
            echo '| --- | --- |'
            docker stats --no-stream --format '| {{.Name}} | {{.MemUsage}} |' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container status and logs
        if: failure()
        run: |
          ./run-demo.sh status || true
          docker compose --project-directory "$PROD" -f "$PROD/compose.yml" logs --no-color --tail 150 || true
